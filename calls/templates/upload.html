<!DOCTYPE html>
<html>
<head>
    <title>Call Risk Analysis</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
        }
        .container {
            width: 650px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        .option {
            margin: 15px 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        #loader {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>

    <script>
        let mediaRecorder;
        let audioChunks = [];

        function toggleInput() {
            const upload = document.getElementById("uploadDiv");
            const record = document.getElementById("recordDiv");
            const choice = document.querySelector('input[name="mode"]:checked').value;

            upload.style.display = choice === "upload" ? "block" : "none";
            record.style.display = choice === "record" ? "block" : "none";
        }

        function startRecording() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

                    document.getElementById("status").innerText = "🎙 Recording...";
                });
        }

        function stopRecording() {
            mediaRecorder.stop();
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
                const audioFile = new File([audioBlob], "recorded.wav");

                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(audioFile);
                document.getElementById("audioInput").files = dataTransfer.files;

                document.getElementById("status").innerText = "✅ Recording ready";
            };
        }

        function showLoader() {
            const audioInput = document.getElementById("audioInput");
            if (!audioInput.files.length) {
                alert("Please upload or record an audio first.");
                return false;
            }
            document.getElementById("loader").style.display = "block";
            document.getElementById("mainForm").style.display = "none";
            return true;
        }
    </script>
</head>

<body>

<div class="container">

    <h2>Call Risk Analysis</h2>

    <form id="mainForm" method="POST" enctype="multipart/form-data"
          action="/analyze/" onsubmit="return showLoader()">
        {% csrf_token %}

        <div class="option">
            <input type="radio" name="mode" value="upload" checked onclick="toggleInput()"> Upload Audio
            <input type="radio" name="mode" value="record" onclick="toggleInput()"> Record Audio
        </div>

        <div id="uploadDiv">
            <input type="file" id="audioInput" name="audio" accept=".wav,.mp3">
        </div>

        <div id="recordDiv" style="display:none;">
            <button type="button" onclick="startRecording()">🎙 Start Recording</button>
            <button type="button" onclick="stopRecording()">⏹ Stop Recording</button>
            <p id="status"></p>
        </div>

        <button type="submit">Analyze Call</button>
    </form>

    <div id="loader">
        <div class="spinner"></div>
        <p>Analyzing your call… Please wait.</p>
    </div>

</div>

</body>
</html>
